<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BRIDGE LAB demo video</title>
<style>
  body{margin:0;background:#0b0f1a;color:#e8ecf4;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;display:flex;flex-direction:column;align-items:center;gap:16px;padding:24px}
  h1{font-size:18px;font-weight:600;margin:0;letter-spacing:.02em}
  video{width:min(1100px,100%);background:#000;border-radius:6px}
  p{color:#9aa6bd;max-width:560px;text-align:center;line-height:1.5}
  a{color:#9db4ff}
</style>
</head>
<body>
<h1>BRIDGE LAB demo video</h1>
<video id="v" controls preload="metadata" src="demo.mp4"></video>
<p id="missing" hidden>No video yet. Save your recording as <code>demo-ui/demo.mp4</code> and reload this page.</p>
<p><a href="/">Back to BRIDGE LAB</a></p>
<script>
document.getElementById('v').addEventListener('error', function () {
  this.hidden = true;
  document.getElementById('missing').hidden = false;
});
</script>
</body>
</html>
